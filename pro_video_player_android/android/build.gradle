plugins {
    id 'com.android.library'
    id 'jacoco'
}

group 'dev.pro_video_player.android'
version '1.0-SNAPSHOT'

// Flutter SDK location
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    flutterRoot = System.env.FLUTTER_ROOT
}
// Try to find Flutter via FVM if not found
if (flutterRoot == null) {
    // Try multiple potential locations for .fvmrc
    def fvmrcLocations = [
        new File(projectDir, '../../../.fvmrc'),  // From pro_video_player_android/android
        new File(projectDir, '../../.fvmrc'),      // From example app context
    ]

    def fvmrc = fvmrcLocations.find { it.exists() }
    if (fvmrc != null) {
        def fvmConfig = new groovy.json.JsonSlurper().parse(fvmrc)
        def fvmVersion = fvmConfig.flutter
        flutterRoot = System.getProperty('user.home') + '/fvm/versions/' + fvmVersion
        println "Flutter SDK resolved via FVM ($fvmVersion): $flutterRoot"
    } else {
        println "FVM config (.fvmrc) not found in expected locations"
    }
} else {
    println "Flutter SDK found: $flutterRoot"
}

if (flutterRoot == null) {
    println "WARNING: Flutter SDK not found! io.flutter.plugin.* classes will not be available for compilation."
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace 'dev.pro_video_player.android'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
    }

    defaultConfig {
        minSdk 24
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    buildTypes {
        debug {
            testCoverageEnabled true
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Flutter embedding (required for io.flutter.plugin.* classes)
    if (flutterRoot != null) {
        compileOnly files("$flutterRoot/bin/cache/artifacts/engine/android-arm-release/flutter.jar")
    }

    implementation "androidx.media3:media3-exoplayer:1.2.0"
    implementation "androidx.media3:media3-exoplayer-dash:1.2.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.2.0"
    implementation "androidx.media3:media3-ui:1.2.0"
    implementation "androidx.media3:media3-session:1.2.0"
    implementation "androidx.media3:media3-cast:1.2.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.gms:play-services-cast-framework:21.4.0"

    // Unit testing dependencies (pure JVM tests, no Android runtime)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'

    // Android instrumentation test dependencies
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test:core-ktx:1.5.0'
    androidTestImplementation 'org.mockito:mockito-android:5.8.0'
    androidTestImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'

    // Espresso for UI testing
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
}

jacoco {
    toolVersion = "0.8.11"
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
        csv.required = false
        xml.outputLocation = file("${buildDir}/reports/jacoco/test/jacocoTestReport.xml")
        html.outputLocation = file("${buildDir}/reports/jacoco/test/html")
    }

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*']
    def debugTree = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/kotlin"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: buildDir, includes: [
        'jacoco/testDebugUnitTest.exec',
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
    ]))
}

// Instrumented test coverage report
tasks.register('jacocoConnectedTestReport', JacocoReport) {
    dependsOn 'connectedDebugAndroidTest'

    reports {
        xml.required = true
        html.required = true
        csv.required = false
        xml.outputLocation = file("${buildDir}/reports/jacoco/connectedTest/jacocoConnectedTestReport.xml")
        html.outputLocation = file("${buildDir}/reports/jacoco/connectedTest/html")
    }

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*']
    def debugTree = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/kotlin"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: "${buildDir}/outputs/code_coverage/debugAndroidTest/connected", includes: ['**/*.ec']))
}

// Combined coverage report (unit + instrumented tests)
// This is the PRIMARY coverage report - use this for full Android native coverage
// Run: ./gradlew testDebugUnitTest connectedDebugAndroidTest jacocoCombinedReport
tasks.register('jacocoCombinedReport', JacocoReport) {
    dependsOn 'testDebugUnitTest', 'connectedDebugAndroidTest', 'compileDebugKotlin'

    reports {
        xml.required = true
        html.required = true
        csv.required = false
        xml.outputLocation = file("${buildDir}/reports/jacoco/combined/jacocoCombinedReport.xml")
        html.outputLocation = file("${buildDir}/reports/jacoco/combined/html")
    }

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*']
    def debugTree = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/kotlin"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: buildDir, includes: [
        // Unit test coverage
        'jacoco/testDebugUnitTest.exec',
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
        // Instrumentation test coverage (the main source of coverage)
        'outputs/code_coverage/debugAndroidTest/connected/**/*.ec'
    ]))
}
